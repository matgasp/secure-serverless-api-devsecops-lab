name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run unit security tests
        run: python -m unittest discover -s tests -v

      - name: Run secret and unsafe-pattern checks
        run: python tools/security_checks.py

      - name: Validate OpenAPI contract
        run: npm run validate:openapi

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt --strict

      - name: Build Lambda deployment package
        run: python tools/package_lambda.py

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v6
        with:
          name: secure-serverless-api-lambda
          path: dist/lambda.zip
          if-no-files-found: error
          retention-days: 14
