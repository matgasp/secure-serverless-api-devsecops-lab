name: DAST

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TARGET_URL: ${{ vars.DAST_TARGET_URL }}
  DAST_USER_TOKEN: ${{ secrets.DAST_USER_TOKEN }}
  DAST_OTHER_USER_TOKEN: ${{ secrets.DAST_OTHER_USER_TOKEN }}
  DAST_LICENSE_ID: ${{ vars.DAST_LICENSE_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dast

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Require an HTTPS target
        shell: bash
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "Environment variable DAST_TARGET_URL is required." >&2
            exit 1
          fi
          case "$TARGET_URL" in
            https://*) ;;
            *)
              echo "DAST_TARGET_URL must use HTTPS." >&2
              exit 1
              ;;
          esac

      - name: Run non-destructive DAST checks
        run: python tools/dast_scan.py

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dast-report
          path: reports/dast.json
          if-no-files-found: warn
          retention-days: 30
