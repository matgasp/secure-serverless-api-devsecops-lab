[project]
name = "secure-serverless-api-devsecops-lab"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "boto3==1.43.85",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
